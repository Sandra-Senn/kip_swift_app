# Install once:   uv tool install pre-commit && pre-commit install
# Run manually:   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Secret scanning (exposé: no secrets in the repo).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Swift formatting and linting with swift-format (ships with the toolchain).
  - repo: local
    hooks:
      - id: swift-format
        name: swift-format (format)
        entry: swift-format format --in-place --parallel
        language: system
        types: [swift]
      - id: swift-format-lint
        name: swift-format (lint --strict)
        entry: swift-format lint --strict --parallel
        language: system
        types: [swift]
